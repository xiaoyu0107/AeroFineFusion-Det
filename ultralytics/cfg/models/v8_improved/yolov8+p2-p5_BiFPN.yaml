# YOLOv8 object detection model with P2/4 - P4/16 outputs
# Docs: https://docs.ultralytics.com/models/yolov8

# Parameters
nc: 80  # number of classes
scales:  # model compound scaling constants
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# YOLOv8 backbone (P1 - P4, no P5)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]         # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]        # 1-P2/4
  - [-1, 3, C2f, [128, True]]         # 2
  - [-1, 1, Conv, [256, 3, 2]]        # 3-P3/8
  - [-1, 6, C2f, [256, True]]         # 4
  - [-1, 1, Conv, [512, 3, 2]]        # 5-P4/16
  - [-1, 6, C2f, [512, True]]     # 6
  - [-1, 1, SPPF, [512, 5]]         # 7

# YOLOv8 head (Detect P2, P3, P4)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 7
  - [[-1, 4], 1, BiFPN_Add, [256]]                    # 8, cat backbone P3
  - [-1, 3, C2f, [256]]                          # 9 (P3/8-small)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 10
  - [[-1, 2], 1, BiFPN_Add, [128]]                    # 11, cat backbone P2
  - [-1, 3, C2f, [128]]                          # 12 (P2/4-xsmall)

  - [-1, 1, Conv, [128, 3, 2]]                   # 13
  - [[-1, 4, 10], 1, BiFPN_Add, [64]]                    # 14, cat head P3
  - [-1, 3, C2f, [256]]                          # 15 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                   # 16
  - [[-1, 7], 1, BiFPN_Add, [128]]                    # 17, cat head P4
  - [-1, 3, C2f, [512]]                          # 18 (P4/16-medium)

  - [[13, 16, 19], 1, Detect, [nc]]              # 19 Detect(P2, P3, P4)
