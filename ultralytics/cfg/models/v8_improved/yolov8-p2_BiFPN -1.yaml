# Ultralytics YOLOv8 object detection model with P2/4 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolov8
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# YOLOv8.0 backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
head:
  # ========= Top-Down Path (带 C2f) =========
  # P4_td = BiFPN_Add(P4, P5) -> C2f
  - [[6, 9], 1, BiFPN_Add, [512]]      # 10: P4_td_fused
  - [-1, 3, C2f, [512]]          # 11: P4_td (refined)

  # P3_td = BiFPN_Add(P3, P4_td) -> C2f
  - [[4, 11], 1, BiFPN_Add, [256]]     # 12: P3_td_fused
  - [-1, 3, C2f, [256]]          # 13: P3_td (refined)

  # P2_td = BiFPN_Add(P2, P3_td) -> C2f
  - [[2, 13], 1, BiFPN_Add, [128]]     # 14: P2_td_fused
  - [-1, 3, C2f, [128]]          # 15: P2_td (refined)

  # # ========= Bottom-Up Path (带 C2f) =========
  # # P2_out = BiFPN_Add(P2, P2_td) -> C2f
  # - [[2, 15], 1, BiFPN_Add, [64]]     # 16: P2_out_fused
  # - [-1, 3, C2f, [128]]          # 17: P2_out

  # P3_out = BiFPN_Add(P3, P3_td, P2_out) -> C2f
  - [[4, 13, 15], 1, BiFPN_Add, [64]] # 18: P3_out_fused
  - [-1, 3, C2f, [256]]          # 19: P3_out

  # P4_out = BiFPN_Add(P4, P4_td, P3_out) -> C2f
  - [[6, 11, 17], 1, BiFPN_Add, [128]] # 20: P4_out_fused
  - [-1, 3, C2f, [512]]          # 21: P4_out

  # P5_out = BiFPN_Add(P5, P4_out) -> C2f
  - [[9, 19], 1, BiFPN_Add, [256]]    # 22: P5_out_fused
  - [-1, 3, C2f, [1024]]         # 23: P5_out

  # ========= Detect 四个尺度 =========
  - [[15, 17, 19, 21], 1, Detect, [nc]]  # Detect(P2_out, P3_out, P4_out, P5_out)
